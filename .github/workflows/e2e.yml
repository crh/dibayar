name: CI

on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1-5"

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Shell-script suite for scripts/vercel-ignore-build.sh: not covered by
      # `npm test` (vitest.config.ts scopes that to src/**/*.test.{ts,tsx}),
      # so it must run explicitly or a regression in the inverted exit-code
      # behavior/branch allowlist could merge with green CI (PR #16 Codex P2).
      - run: npm run test:vercel-ignore-build
      # The vendored Impeccable launcher must only run an engine binary whose
      # SHA-256 is committed and whose version matches (PR #37 Codex P1/P2).
      # `npx impeccable update` silently restores the unchecked upstream
      # launcher; this is what notices. Mock engines only, no network.
      - run: npm run test:impeccable-launcher
      # User-action inventory (docs/testing/journey-coverage.json): rejects
      # duplicate IDs, invalid statuses/priorities, a stale generated report,
      # and test references that are not tests Playwright registers
      # (`playwright test --list`) or that are skipped / fixme'd / expected
      # to fail in a claimed project. No build/browser/DB, so it adds
      # seconds. It does not enforce a coverage percentage -- no threshold is
      # a gate until Chris approves one.
      - run: npm run test:journey-coverage
      - run: npm run coverage:journeys
      # Every E2E/UX-audit job below builds with `next build --webpack`
      # (see docs/testing/E2E.md) for a reproducible browser-test target, so
      # nothing else in this workflow exercises the default Turbopack build
      # Vercel actually deploys with. Build-only, no services needed: every
      # route is dynamic (ƒ), so no DATABASE_URL/AUTH_SECRET is read at
      # build time -- confirmed by running with an empty environment.
      - run: npm run build

  e2e-critical:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Bound to the exact 127.0.0.1:55432/dibayar_test target that
    # scripts/e2e-fixtures.ts requires (see docs/testing/E2E.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dibayar_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/dibayar_test?schema=public
      # Not real credentials -- Google OAuth itself is never exercised by
      # this suite (auth is seeded directly via a real Auth.js database
      # session; see docs/testing/E2E.md "How authentication works"). These
      # exist only so next-auth's Google provider config doesn't throw on
      # missing values at import time.
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret
      AUTH_GOOGLE_ID: ci-only-placeholder
      AUTH_GOOGLE_SECRET: ci-only-placeholder
      E2E_FIXTURE_CONFIRM: non-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # e2e/invoices/pdf-download.spec.ts reads the downloaded invoice PDFs
      # with pdftotext (poppler-utils, e2e/support/pdf.ts) -- not preinstalled
      # on the ubuntu-latest runner image. Same package the ux-audit job uses.
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - run: npx prisma migrate deploy
      - run: npm run test:e2e:critical
      # The inventory's "real" claims against this actual run: a referenced
      # real test that ran here but was skipped, failed, or expected to fail
      # is an error; claims whose tests are not @critical are listed as not
      # exercised by this run.
      - run: npm run coverage:journeys -- --results test-results/e2e/results.json
      # Negative control for the browserDiagnostics fixture itself (see
      # docs/testing/E2E.md) -- needs only the Chromium install above, no
      # database or build, so it runs here rather than its own job.
      - run: npm run test:diagnostics-selftest
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/e2e
            test-results/e2e
          retention-days: 7

  e2e-a11y:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dibayar_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/dibayar_test?schema=public
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret
      AUTH_GOOGLE_ID: ci-only-placeholder
      AUTH_GOOGLE_SECRET: ci-only-placeholder
      E2E_FIXTURE_CONFIRM: non-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run test:e2e:a11y
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-artifacts
          path: |
            playwright-report/e2e
            test-results/e2e
          retention-days: 7

  ux-audit:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # Deterministic UX QA gate (docs/testing/UX_AUDIT.md): functional,
    # responsive-layout, state/data, and visual-regression checks for
    # tests/ux-audit/. Runs in parallel with e2e-critical, not nested in it,
    # so a UX-audit failure never blocks or slows down the critical-path
    # gate. Same disposable Postgres target as e2e-critical.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dibayar_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/dibayar_test?schema=public
      # Same placeholder rationale as e2e-critical above -- OAuth itself is
      # never exercised (real Auth.js database sessions are seeded directly).
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret
      AUTH_GOOGLE_ID: ci-only-placeholder
      AUTH_GOOGLE_SECRET: ci-only-placeholder
      E2E_FIXTURE_CONFIRM: non-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # tests/ux-audit/fixtures.baseline.spec.ts and t27.verification.spec.ts
      # shell out to pdftotext/pdfinfo (poppler-utils) to assert on real PDF
      # content -- not preinstalled on the ubuntu-latest runner image.
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
          pdfinfo -v
      - run: npx prisma migrate deploy
      - run: npm run ux:audit
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-report
          path: |
            artifacts/ux-audit
            playwright-report/e2e
            test-results/e2e
          retention-days: 7

  # Scheduled acceptance signal (weekdays) and manual dispatch. The full
  # journey-coverage verification lives in its own workflow
  # (journey-coverage-full.yml), so no job of that lane can change this
  # workflow run's result.
  e2e-cross-browser:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dibayar_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/dibayar_test?schema=public
      AUTH_SECRET: ci-only-placeholder-not-a-real-secret
      AUTH_GOOGLE_ID: ci-only-placeholder
      AUTH_GOOGLE_SECRET: ci-only-placeholder
      E2E_FIXTURE_CONFIRM: non-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      # e2e/invoices/pdf-download.spec.ts reads the downloaded invoice PDFs
      # with pdftotext (poppler-utils, e2e/support/pdf.ts) -- not preinstalled
      # on the ubuntu-latest runner image. Same package the ux-audit job uses.
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - run: npx prisma migrate deploy
      - run: npm run test:e2e:all-browsers
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-cross-browser-artifacts
          path: |
            playwright-report/e2e
            test-results/e2e
          retention-days: 14
